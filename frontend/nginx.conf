# Production SPA server: serves the built frontend and reverse-proxies the API.
# The backend service is reachable as "backend" on the compose network.

upstream api_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name _;

    # Match backend MAX_UPLOAD_MB (100) plus headroom for multipart overhead.
    client_max_body_size 120m;

    root /usr/share/nginx/html;
    index index.html;

    # Static SPA assets with long cache for hashed bundles.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API + auth proxied to the FastAPI backend (same-origin, no CORS needed).
    location /api/ {
        proxy_pass http://api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Server-Sent Events (chat streaming): disable buffering, keep alive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA fallback: every other route serves index.html (client-side routing).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
